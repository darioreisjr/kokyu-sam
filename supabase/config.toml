# Local Supabase development stack configuration.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "kokyu"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

# Local email testing UI (formerly "Inbucket") - lets us test signup/
# confirmation/recovery emails without any real SMTP provider. See
# docs/testing.md.
[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3001"
additional_redirect_urls = [
  "http://localhost:3001/auth/callback",
  "http://localhost:3001/reset-password",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Required in every environment - never disable to "make local testing
# easier". See docs/security.md.
enable_confirmations = true
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.rate_limit]
sign_in_sign_ups = 30
token_refresh = 150
otp = 30

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = "http://127.0.0.1:54321/auth/v1/callback"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[realtime]
enabled = false

[storage]
enabled = false
